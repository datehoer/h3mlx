[project]
name = "h3mlx"
version = "0.1.0"
description = "Agent-first MiniMax H3 generation and verification on Apple Silicon via mlx-h3."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
h3mlx = "h3mlx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h3mlx"]
